name: Deploy NestJS to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # TODO: Replace with your actual Azure Web App name
  AZURE_WEBAPP_NAME: 'my-nestjs-app-name' 
  NODE_VERSION: '22' 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies, build, and prune
      run: |
        npm ci
        npm run build --if-present
        # Removes devDependencies (like @types, eslint) to reduce deployment size
        npm prune --production

    # This zips the current folder (including dist and node_modules)
    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: . 

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      # This captures the URL provided by the deploy step output
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
